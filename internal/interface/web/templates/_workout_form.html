{{define "workout_form"}}
<dialog id="create-workout-modal" class="dialog sheet" aria-labelledby="create-workout-title"
        onclick="if (event.target === this) this.close()">
    <form method="POST" action="/workouts" class="bg-card w-full max-w-md gap-0 rounded-xl border shadow-lg">
        <header class="gap-1.5 p-6 pb-4">
            <h2 id="create-workout-title" class="text-lg font-semibold">Add a workout</h2>
            <p class="text-muted-foreground text-sm">A workout you can log again and again, like Fran.</p>
        </header>
        <section class="flex flex-col gap-4 overflow-y-auto px-6">
            <div class="field">
                <label for="create-type">Type</label>
                <select id="create-type" name="type" onchange="toggleLiftingFields(this, 'create')">
                    {{range .WorkoutTypes}}
                    <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
            <div id="create-name-field" class="field">
                <label for="create-name">Name</label>
                <input type="text" id="create-name" name="name" placeholder="e.g. Fran" />
            </div>
            <div id="create-lifting-fields" class="border-muted flex hidden flex-col gap-4 border-l-2 pl-4">
                <div class="field">
                    <label for="create-lift">Lift</label>
                    <select id="create-lift" name="lift_id">
                        <option value="">(none)</option>
                        {{range .Lifts}}
                        <option value="{{.Id}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>
                <div class="field">
                    <label for="create-date">Date</label>
                    <input type="date" id="create-date" name="date" value="{{.Today}}" />
                    <p class="text-muted-foreground text-sm">The name is built from the lift and date.</p>
                </div>
            </div>
            <div class="field">
                <label for="create-description">Description</label>
                <textarea id="create-description" name="description" rows="4"
                    placeholder="21-15-9&#10;Thrusters (95/65)&#10;Pull-ups"></textarea>
            </div>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                <div class="field">
                    <label for="create-time-cap">Time cap <span class="text-muted-foreground font-normal">(min)</span></label>
                    <input type="number" id="create-time-cap" name="time_cap" min="0" inputmode="numeric" />
                </div>
                <div class="field">
                    <label for="create-rounds">Rounds</label>
                    <input type="number" id="create-rounds" name="rounds" inputmode="numeric" />
                </div>
                <div class="field">
                    <label for="create-interval">Interval <span class="text-muted-foreground font-normal">(sec)</span></label>
                    <input type="number" id="create-interval" name="interval_seconds" min="0" inputmode="numeric" />
                </div>
            </div>
        </section>
        <footer class="gap-2 p-6">
            <button type="button" class="btn w-full sm:w-auto" data-variant="outline" onclick="this.closest('dialog').close()">Cancel</button>
            <button type="submit" class="btn w-full sm:w-auto">Add workout</button>
        </footer>
    </form>
</dialog>

<script>
// toggleLiftingFields hides/shows the lift+date block and toggles the plain
// name input when the user switches a workout to/from the "lifting" type.
// For lifting, the server derives the title from the selected lift + date,
// so the name input is replaced entirely.
function toggleLiftingFields(select, prefix) {
    var lifting = document.getElementById(prefix + '-lifting-fields');
    var name = document.getElementById(prefix + '-name-field');
    var isLifting = select.value === 'lifting';
    if (lifting) lifting.classList.toggle('hidden', !isLifting);
    if (name) name.classList.toggle('hidden', isLifting);
}
</script>
{{end}}
