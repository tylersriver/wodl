{{define "workout_selector"}}
<div class="field">
    <label>Workouts <span class="text-muted-foreground font-normal">(tap in the order you did them)</span></label>
    {{if .Workouts}}
    <div class="workout-selector-root max-h-72 overflow-y-auto rounded-lg border p-1"
         data-ids-container="{{.Prefix}}-workout-ids"
         data-initial="{{.InitialOrderCSV}}">
        {{range .Workouts}}
        <label class="hover:bg-accent/50 flex min-h-12 cursor-pointer items-center gap-3 rounded-md px-3 py-2">
            <input type="checkbox" data-workout-id="{{.Id}}" class="input" />
            <span class="workout-order-badge badge hidden shrink-0"></span>
            <span class="flex flex-1 flex-wrap items-center gap-2 text-sm font-normal">
                {{.Name}}
                <span class="badge" data-variant="outline">{{.Type}}</span>
            </span>
        </label>
        {{end}}
    </div>
    <div id="{{.Prefix}}-workout-ids" class="hidden"></div>
    <p class="text-muted-foreground text-sm">The number shows where each workout lands in the session.</p>
    {{else}}
    <p class="text-muted-foreground text-sm">
        You have no workouts yet. <a href="/workouts" class="text-foreground font-medium underline underline-offset-4">Create one first</a>.
    </p>
    {{end}}
</div>
{{end}}
