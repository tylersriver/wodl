{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WODL - Workout Logger</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WODL" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="bg-background/95 sticky top-0 z-30 border-b backdrop-blur">
    <div class="mx-auto flex h-14 max-w-3xl items-center gap-2 px-4">
        <a href="/" class="text-lg font-semibold tracking-tight">WODL</a>

        <nav class="ml-4 hidden items-center gap-1 sm:flex">
            <a href="/lifts" class="btn" data-variant="ghost" data-size="sm">Lifts</a>
            <a href="/workouts" class="btn" data-variant="ghost" data-size="sm">Workouts</a>
            <a href="/sessions" class="btn" data-variant="ghost" data-size="sm">Sessions</a>
        </nav>

        <div class="ml-auto flex items-center gap-2">
            <a href="/quick-log" class="btn hidden sm:inline-flex" data-size="sm">Log a workout</a>
            <form method="POST" action="/logout">
                <button type="submit" class="btn" data-variant="ghost" data-size="sm" aria-label="Log out">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                    <span class="hidden sm:inline">Log out</span>
                </button>
            </form>
        </div>
    </div>
</header>

<main class="has-tabbar mx-auto max-w-3xl px-4 py-6 sm:pb-10">
{{end}}

{{define "tail"}}
</main>

<!--
  Bottom tab bar. Phones get a persistent nav instead of a hamburger menu so
  every destination is one tap away; hidden from the small-breakpoint up, where
  the header nav takes over.
-->
<nav class="tabbar bg-background fixed inset-x-0 bottom-0 z-40 border-t sm:hidden" aria-label="Main">
    <ul class="mx-auto grid max-w-3xl grid-cols-5 items-end">
        <li>
            <a href="/" data-nav="/" class="text-muted-foreground flex min-h-16 flex-col items-center justify-center gap-1 text-[0.6875rem] font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
        </li>
        <li>
            <a href="/lifts" data-nav="/lifts" class="text-muted-foreground flex min-h-16 flex-col items-center justify-center gap-1 text-[0.6875rem] font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
                Lifts
            </a>
        </li>
        <li>
            <a href="/quick-log" data-nav="/quick-log" aria-label="Log a workout" class="flex min-h-16 flex-col items-center justify-center gap-1">
                <span class="bg-primary text-primary-foreground flex size-12 items-center justify-center rounded-full shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </span>
            </a>
        </li>
        <li>
            <a href="/workouts" data-nav="/workouts" class="text-muted-foreground flex min-h-16 flex-col items-center justify-center gap-1 text-[0.6875rem] font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1"/></svg>
                Workouts
            </a>
        </li>
        <li>
            <a href="/sessions" data-nav="/sessions" class="text-muted-foreground flex min-h-16 flex-col items-center justify-center gap-1 text-[0.6875rem] font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                Sessions
            </a>
        </li>
    </ul>
</nav>

<script>
// Highlight the bottom-tab entry matching the current page. Doing this in the
// browser keeps the handlers free of presentation concerns — no template needs
// to pass down which nav item is active.
(function () {
    var path = window.location.pathname;
    var best = null;
    document.querySelectorAll('[data-nav]').forEach(function (link) {
        var target = link.dataset.nav;
        var matches = target === '/' ? path === '/' : path.indexOf(target) === 0;
        if (!matches) return;
        if (!best || target.length > best.dataset.nav.length) best = link;
    });
    if (best && best.dataset.nav !== '/quick-log') {
        best.classList.remove('text-muted-foreground');
        best.classList.add('text-foreground');
        best.setAttribute('aria-current', 'page');
    }
})();

// Attach click-ordered multi-select behaviour to any .workout-selector-root.
// Each checkbox toggle pushes its workout id to an ordered list; that list
// is re-emitted as hidden form inputs so the server receives ids in the
// order the user selected them. Numeric badges reflect the 1-based position.
document.querySelectorAll('.workout-selector-root').forEach(function (root) {
    var ids = document.getElementById(root.dataset.idsContainer);
    if (!ids) return;
    var validIds = new Set();
    root.querySelectorAll('input[type=checkbox][data-workout-id]').forEach(function (cb) {
        validIds.add(cb.dataset.workoutId);
    });
    var order = (root.dataset.initial || '').split(',').filter(function (id) {
        return id && validIds.has(id);
    });

    function render() {
        ids.innerHTML = '';
        order.forEach(function (id) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'workout_ids';
            input.value = id;
            ids.appendChild(input);
        });
        root.querySelectorAll('input[type=checkbox][data-workout-id]').forEach(function (cb) {
            var idx = order.indexOf(cb.dataset.workoutId);
            cb.checked = idx >= 0;
            var badge = cb.closest('label').querySelector('.workout-order-badge');
            if (badge) {
                badge.textContent = idx >= 0 ? String(idx + 1) : '';
                badge.classList.toggle('hidden', idx < 0);
            }
        });
    }

    root.addEventListener('change', function (e) {
        var cb = e.target;
        if (!cb.matches('input[type=checkbox][data-workout-id]')) return;
        var id = cb.dataset.workoutId;
        var pos = order.indexOf(id);
        if (cb.checked && pos < 0) order.push(id);
        if (!cb.checked && pos >= 0) order.splice(pos, 1);
        render();
    });

    render();
});
</script>
</body>
</html>
{{end}}
