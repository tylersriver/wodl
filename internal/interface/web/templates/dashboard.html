{{define "dashboard.html"}}
{{template "head" .}}
<div class="flex flex-col gap-8">
    <section class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
            <h1 class="text-2xl font-semibold tracking-tight">Today</h1>
            <p class="text-muted-foreground text-sm">Record what you did at the gym.</p>
        </div>
        <a href="/quick-log" class="btn w-full" data-size="lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Log a workout
        </a>
        <div class="grid grid-cols-2 gap-3">
            <button type="button" class="btn" data-variant="outline" onclick="openDialog('create-lift-modal')">Add a lift</button>
            <button type="button" class="btn" data-variant="outline" onclick="openDialog('create-workout-modal')">Add a workout</button>
        </div>
    </section>

    <section class="flex flex-col gap-3">
        <label for="dashboard-search" class="text-sm font-medium">Find something you've saved</label>
        <input type="search" id="dashboard-search" name="q" placeholder="Search lifts, workouts & sessions"
            class="input w-full"
            hx-get="/api/search"
            hx-trigger="input changed delay:200ms, search"
            hx-target="#search-results"
            hx-params="*"
            autocomplete="off" />
        <div id="search-results"></div>
    </section>
</div>

{{template "lift_form" .}}
{{template "workout_form" .}}
{{template "dialog_script" .}}
{{template "tail" .}}
{{end}}
