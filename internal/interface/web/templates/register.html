{{define "register.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WODL - Register</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WODL" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
    <link rel="stylesheet" href="{{asset "app.css"}}" />
</head>
<body class="bg-muted/40 flex min-h-screen items-start justify-center p-4 sm:items-center sm:p-6">
    <div class="w-full max-w-sm">
        <div class="card bg-card sm:border sm:shadow-sm">
            <header class="gap-1 p-6 pb-2 text-center">
                <h1 class="text-2xl font-semibold tracking-tight">WODL</h1>
                <p class="text-muted-foreground text-sm">Create your account</p>
            </header>
            <section class="flex flex-col gap-4 p-6">
                {{if .Error}}
                <div class="alert" data-variant="destructive" role="alert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    <h2>{{.Error}}</h2>
                </div>
                {{end}}
                <form method="POST" action="/register" class="flex flex-col gap-4">
                    <div class="field">
                        <label for="display_name">Display name</label>
                        <input type="text" id="display_name" name="display_name" required autocomplete="name" />
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email" />
                    </div>
                    {{template "password_field" (dict "Name" "password" "Autocomplete" "new-password" "MinLength" 8)}}
                    <button type="submit" class="btn w-full" data-size="lg">Create account</button>
                </form>
                <p class="text-muted-foreground text-center text-sm">
                    Already have an account? <a href="/login" class="text-foreground font-medium underline underline-offset-4">Log in</a>
                </p>
            </section>
        </div>
    </div>
    {{template "password_reveal_script" .}}
</body>
</html>
{{end}}
